<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4d34" />
      <stop offset="100%" stop-color="#0f2e1f" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f2e1f" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="12" fill="url(#primaryGrad)" filter="url(#shadow)" />
    <!-- Shelter Roof -->
    <path d="M12 21L24 11L36 21" stroke="#dcfce7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Sprout in Center -->
    <path d="M24 16C24 16 21 21 21 24.5C21 26.5 22.3 27.5 24 27.5C25.7 27.5 27 26.5 27 24.5C27 21 24 16 24 16Z" fill="url(#leafGrad)" />
    <!-- Caring Hands -->
    <path d="M14 27C17 30 20 31 24 31C28 31 31 30 34 27" stroke="#86efac" stroke-width="2" stroke-linecap="round" />
    <circle cx="24" cy="22" r="1.5" fill="url(#warmGrad)" />
  </g>

  <!-- Typography -->
  <text x="52" y="24" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1b4d34" letter-spacing="-0.3">Surplus<tspan fill="#16a34a">2</tspan>Shelter</text>
  <text x="52" y="37" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#64748b" letter-spacing="1.2">BENGALURU RESCUE</text>
</svg>
